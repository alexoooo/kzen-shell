# Local development config for kzen-shell (git-tracked; used for end-to-end smoke testing).
#
# Paths are RELATIVE to the shell's working directory (the kzen-shell repo root when running
# KzenShellMain from a standalone IntelliJ project). The shell resolves them to absolute file://
# URIs at boot, so this file contains no machine-specific strings.
#
# Build the launcher zip with:  cd ../kzen-launcher && ./gradlew dist
# file:// sources are re-acquired on every boot, so a rebuilt zip is picked up with no cache nuking.
# For a release, point launcher.zip/.dir at the published GitHub artifact (see the commented lines).
#
# (The project archetype is the launcher's concern, configured in kzen-launcher, not here.)

launcher.zip=../kzen-launcher/kzen-launcher-jvm/build/dist/kzen-launcher-0.30.0-SNAPSHOT.zip
launcher.dir=../work/kzen-launcher/kzen-launcher-0.30.0-SNAPSHOT

